<style>
  /* ---------- Page theme tokens ---------- */
  :root {
    --bg: #e7e2ee; --bg-glow: #f6f2fb; --ink: #2a2236; --muted: #6b6178;
    --btn: #ffffffb3; --btn-on: #2a2236; --btn-on-ink: #f6f2fb; --focus: #6a4bd6;
    --cw: min(290px, 66vw, 40vh);               /* card width drives everything */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1528; --bg-glow: #34244a; --ink: #efe9f7; --muted: #a698b8;
      --btn: #ffffff14; --btn-on: #efe9f7; --btn-on-ink: #1d1528; --focus: #b9a4ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1528; --bg-glow: #34244a; --ink: #efe9f7; --muted: #a698b8;
    --btn: #ffffff14; --btn-on: #efe9f7; --btn-on-ink: #1d1528; --focus: #b9a4ff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; overflow-x: hidden;
    background: radial-gradient(ellipse at 50% 45%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg); color: var(--ink);
    font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 72px 16px 32px;
  }
  .hint { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 1rem; text-align: center; }
  .controls { display: flex; gap: 8px; min-height: 42px; }
  .controls button {
    font: 600 .95rem/1 "Alegreya Sans", system-ui, sans-serif;
    padding: 12px 18px; border-radius: 999px; cursor: pointer;
    background: var(--btn); color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
  }
  .controls button.primary { background: var(--btn-on); color: var(--btn-on-ink); border-color: transparent; }
  .controls button:focus-visible, .card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Stage ---------- */
  .wrap {
    position: relative;
    width: calc(var(--cw) * 1.12);
    height: calc(var(--cw) * 1.704);
    perspective: 900px;
  }
  .wrap.enter { animation: packIn .7s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes packIn { from { transform: translateY(-40px) rotate(-3deg); opacity: 0; } }
  .no-anim, .no-anim * { transition: none !important; }

  /* ---------- The pack ---------- */
  .wrap, .controls { -webkit-user-select: none; user-select: none; }
  .pack {
    --rx: 0deg; --ry: 0deg; --px: 50; --py: 50; --o: .25;
    --mx: calc(var(--px) * 1%); --my: calc(var(--py) * 1%);
    position: absolute; inset: 0;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    container-type: inline-size;
    touch-action: none;
  }
  .pack.sealed { cursor: grab; }
  /* Top strip and body are both full-size, with identical backgrounds,
     clipped along the same jagged tear line so they line up perfectly. */
  .layer {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(115deg, #ffffff12 0 2px, transparent 2px 9px),
      linear-gradient(160deg, #2a1f63 0%, #5a3fc0 34%, #2f86c4 64%, #231a4f 100%);
    filter: drop-shadow(0 18px 24px #0006);
  }
  .sheen {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(farthest-corner circle at var(--mx) var(--my),
      #ffffffb0 6%, #ffffff30 24%, #00000055 90%);
    mix-blend-mode: overlay; opacity: calc(.45 + var(--o) * .5);
  }
  .crimp {                           /* heat-sealed ridges at top and bottom */
    position: absolute; left: 0; right: 0; height: 6.5%;
    background: repeating-linear-gradient(90deg, #ffffff30 0 2px, #0000 2px 6px),
                linear-gradient(#0003, #fff2, #0003);
  }
  .pack-top { z-index: 3; transition: transform .1s; }
  .pack-top .crimp { top: 0; }
  .pack-top.flying { transition: transform .7s cubic-bezier(.3,.6,.4,1), opacity .7s ease-in; opacity: 0; }
  .tear-label {
    position: absolute; left: 6%; top: 8%;
    font: 700 3.4cqw/1 "Alegreya Sans", sans-serif; color: #ffffffc0; font-style: italic;
  }
  .pack-body { z-index: 2; transition: transform .6s cubic-bezier(.5,0,.8,.4), opacity .6s ease-in; }
  .pack-body .crimp { bottom: 0; }
  .pack-body.leave { transform: translateY(75%) rotate(4deg); opacity: 0; }
  .pack-art {
    position: absolute; inset: 20% 8% 10%;
    display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff;
  }
  .pack-art svg { width: 78%; margin-top: 4%; filter: drop-shadow(0 0 14px #b9a4ff80); }
  .set-name {
    font: italic 800 11cqw/0.95 "Alegreya", Georgia, serif; letter-spacing: -.01em;
    margin-top: 6%;
    text-shadow: 0 2px 0 #1a1240, 0 0 18px #9fe8ff80;
  }
  .pack-sub { margin-top: auto; font: 700 4cqw/1.2 "Alegreya Sans", sans-serif; color: #e6defff0; }
  .tear-line { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; transition: opacity .2s; }
  .tear-line .guide { stroke: #ffffffa0; stroke-dasharray: 1.2 1.4; }
  .tear-line .rip { stroke: #fff; stroke-dasharray: 1 1; filter: drop-shadow(0 0 3px #fff); }

  /* ---------- Card stack (lives inside the pack, between body and top) ---------- */
  .stack {
    position: absolute; left: 0; right: 0; margin-inline: auto; top: 15%;
    width: var(--cw); aspect-ratio: 63 / 88;
    z-index: 1;
    transition: transform .75s cubic-bezier(.2,.9,.25,1);
  }
  .pack.out .stack { z-index: 5; }
  .slot {
    position: absolute; inset: 0;
    perspective: 900px;
    container-type: inline-size;
    transform: translate(calc(var(--i) * 3px), calc(var(--i) * -2px));
    transition: transform .45s cubic-bezier(.3,.7,.3,1), opacity .45s;
  }
  .slot.gone { transform: translate(-135%, -8%) rotate(-16deg); opacity: 0; pointer-events: none; }
  .burst {
    position: absolute; left: 50%; top: 50%; z-index: 0; pointer-events: none;
    width: calc(var(--cw) * 2.2); aspect-ratio: 1; border-radius: 50%;
    translate: -50% -50%; opacity: 0;
    background:
      radial-gradient(circle, #fff8 0%, #d7c8ff66 25%, transparent 60%),
      repeating-conic-gradient(from 0deg, #ffffff55 0deg 5deg, transparent 5deg 16deg);
    -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 68%);
            mask-image: radial-gradient(circle, #000 20%, transparent 68%);
  }
  .burst.go { animation: burst 1.4s ease-out forwards; }
  @keyframes burst {
    0% { opacity: 0; transform: scale(.4) rotate(0deg); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.25) rotate(40deg); }
  }

  /* ---------- Cards ---------- */
  .card {
    --rx: 0deg; --ry: 0deg; --px: 50; --py: 50; --o: .25;
    --mx: calc(var(--px) * 1%); --my: calc(var(--py) * 1%);
    width: 100%; height: 100%;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    border-radius: 4.5% / 3.2%;
    touch-action: none; cursor: pointer;
    box-shadow: 0 2px 4px #0003, calc(var(--ry) * -.8) calc(12px + var(--rx) * .8) 36px -8px #0007;
  }
  .face {
    position: relative; width: 100%; height: 100%;
    border-radius: inherit; overflow: hidden; isolation: isolate;
    padding: 5.5% 5.5% 4%;
    display: flex; flex-direction: column;
    color: #1c1b22;
  }
  .frame-bg {
    position: absolute; inset: 0; z-index: -3;
    background: linear-gradient(160deg, var(--f1), var(--f2) 45%, var(--f1) 70%, var(--f2));
  }
  .frame-bg::after {
    content: ""; position: absolute; inset: 3.2%; border-radius: 3% / 2.2%;
    background: linear-gradient(175deg, color-mix(in srgb, var(--f1) 35%, #fff), color-mix(in srgb, var(--f1) 70%, #fff));
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--f2) 70%, #000);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2% 2.5%; }
  .name { font: 800 7.4cqw/1 "Alegreya", Georgia, serif; }
  .hp { display: flex; align-items: center; gap: 1.8cqw; font-weight: 800; font-size: 6cqw; }
  .hp small { font-size: .6em; font-weight: 700; }
  .gem {
    display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff, var(--g1) 40%, var(--g2));
    box-shadow: 0 0 0 1px #0005;
  }
  .gem.plain { background: radial-gradient(circle at 35% 30%, #fff, #d3d6de 45%, #8a90a0); }
  .art {
    position: relative; overflow: hidden; isolation: isolate; aspect-ratio: 1.38;
    border: 3px solid color-mix(in srgb, var(--f2) 80%, #333);
    box-shadow: 0 0 0 1px #0005, inset 0 0 0 1px #fff4;
    background: #120f24;
  }
  .art svg { display: block; width: 100%; height: 100%; }
  .strip {
    margin: 2% 6% 0; padding: 1px 0; text-align: center;
    font-size: 3.3cqw; font-style: italic; font-weight: 500; color: #3b3f4f;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--f2) 55%, #fff), transparent);
  }
  .moves { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6%; padding: 3% 2% 0; }
  .move { display: grid; grid-template-columns: auto 1fr auto; column-gap: 2.6cqw; align-items: baseline; }
  .cost { display: flex; gap: 2px; font-size: 4.4cqw; align-self: center; }
  .move h3 { margin: 0; font-size: 5.3cqw; font-weight: 800; }
  .dmg { font-weight: 800; font-size: 6cqw; }
  .move p { grid-column: 1 / -1; margin: 2px 0 0; font-size: 3.6cqw; line-height: 1.3; color: #2e3140; }
  .foot {
    border-top: 1px solid color-mix(in srgb, var(--f2) 80%, #333); margin-top: 2%; padding-top: 2%;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
    font-size: 3cqw; color: #3b3f4f;
  }
  .flavor { font-style: italic; max-width: 72%; line-height: 1.25; }
  .num { font-weight: 700; white-space: nowrap; }

  /* ---------- Foil layers (rare card only) ---------- */
  .foil {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(-45deg, #0e152e 0%, hsl(180 10% 60%) 3.8%, hsl(180 29% 66%) 4.5%, hsl(180 10% 60%) 5.2%, #0e152e 10%, #0e152e 12%),
      repeating-linear-gradient(110deg, hsl(2 100% 73%) 0%, hsl(53 100% 69%) 7%, hsl(93 100% 69%) 14%, hsl(176 100% 76%) 21%, hsl(228 100% 74%) 28%, hsl(283 100% 73%) 35%, hsl(2 100% 73%) 42%);
    background-size: 400% 400%, 300% 300%;
    background-position: calc(var(--px) * 1%) calc(var(--py) * 1%), calc(var(--px) * -1.5%) calc(var(--py) * -1.5%);
    background-blend-mode: overlay; mix-blend-mode: color-dodge;
    filter: brightness(.55) contrast(1.6) saturate(1.3);
    opacity: var(--o);
  }
  .glitter {
    position: absolute; inset: 0; pointer-events: none;
    background-image: var(--sparkles), linear-gradient(125deg, #ff6bd6, #ffd36b, #6bffb8, #6bc8ff, #b46bff, #ff6bd6);
    background-size: 180px 180px, 300% 300%;
    background-position: calc(var(--px) * .4%) calc(var(--py) * .4%), calc(var(--px) * 1%) calc(var(--py) * 1%);
    background-blend-mode: multiply; mix-blend-mode: color-dodge;
    -webkit-mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0%, transparent 55%);
            mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0%, transparent 55%);
    opacity: calc(var(--o) * 1.2);
  }
  .glare {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(farthest-corner circle at var(--mx) var(--my), #ffffffd0 8%, #ffffff55 22%, #00000066 95%);
    mix-blend-mode: overlay; opacity: calc(var(--o) * .6);
  }
  .card.rare .glare { opacity: calc(var(--o) * .9); }
  .frame-foil { z-index: -2; }
  .card .frame-foil, .card .frame-glitter, .card .art .foil, .card .art .glitter { display: none; }
  .card[data-foil="rainbow"] .art .foil, .card[data-foil="rainbow"] .art .glitter { display: block; }
  .card[data-foil="rainbow"] .art .glitter { opacity: calc(var(--o) * .5); }
  .card[data-foil="reverse"] .frame-foil, .card[data-foil="reverse"] .frame-glitter { display: block; }
  .card[data-foil="cosmos"] .art .glitter { display: block; opacity: calc(var(--o) * 1.6); background-size: 110px 110px, 300% 300%; }
  .card[data-foil="cosmos"] .art .foil {
    display: block;
    background-image:
      radial-gradient(circle at 20% 30%, hsl(300 90% 60% / .9), transparent 35%),
      radial-gradient(circle at 75% 65%, hsl(190 90% 60% / .9), transparent 40%),
      radial-gradient(circle at 50% 110%, hsl(45 100% 60% / .9), transparent 45%);
    background-size: 160% 160%;
    background-position: calc(var(--px) * .6%) calc(var(--py) * .6%);
    filter: brightness(.8) saturate(1.2);
  }
</style>
</head>
<body>

  <div class="wrap enter" id="wrap">
    <div class="pack sealed" id="pack">
      <div class="layer pack-body" id="packBody">
        <div class="pack-art">
          <svg viewBox="-110 -70 220 130" aria-hidden="true">
            <g fill="#ffffff22" stroke="#ffffffcc" stroke-width="1.2">
              <polygon points="-4,-8 -92,-66 -106,-22 -58,6"/><polygon points="4,-8 92,-66 106,-22 58,6"/>
              <polygon points="-4,2 -64,12 -72,52 -22,40"/><polygon points="4,2 64,12 72,52 22,40"/>
            </g>
            <ellipse cx="0" cy="4" rx="7" ry="26" fill="#fff"/><circle cx="0" cy="-20" r="7.5" fill="#fff"/>
          </svg>
          <div class="set-name">Lumen<br>Wilds</div>
          <div class="pack-sub">Booster pack<br>5 cards</div>
        </div>
        <div class="crimp"></div>
        <div class="sheen"></div>
      </div>

      <div class="stack" id="stack"><div class="burst" id="burst"></div></div>

      <div class="layer pack-top" id="packTop">
        <div class="crimp"></div>
        <span class="tear-label">✂ tear here</span>
        <div class="sheen"></div>
      </div>

      <svg class="tear-line" id="tearLine" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline class="guide" fill="none" vector-effect="non-scaling-stroke" stroke-width="1.5" pathLength="100"/>
        <polyline class="rip" fill="none" vector-effect="non-scaling-stroke" stroke-width="2.5" pathLength="1" stroke-dashoffset="1"/>
      </svg>
    </div>
  </div>

  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="controls">
    <button type="button" id="tearBtn">Tear open</button>
    <button type="button" id="againBtn" class="primary" hidden>Open another pack</button>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), pack = $('pack'), packTop = $('packTop'), packBody = $('packBody');
  const stack = $('stack'), burst = $('burst'), tearLine = $('tearLine');
  const guide = tearLine.querySelector('.guide'), rip = tearLine.querySelector('.rip');
  const hint = $('hint'), tearBtn = $('tearBtn'), againBtn = $('againBtn');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TEAR_Y = 14;                     // tear line height, % of pack
  const REST = { rx: 0, ry: 0, px: 50, py: 50, o: .25 };

  /* ---------- Sparkle texture for foil glitter ---------- */
  (() => {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 180, 180);
    for (let i = 0; i < 260; i++) {
      const r = Math.random() < .08 ? 1.6 : Math.random() * .9 + .3;
      g.fillStyle = `rgba(255,255,255,${Math.random() * .8 + .2})`;
      g.beginPath(); g.arc(Math.random() * 180, Math.random() * 180, r, 0, 7); g.fill();
    }
    document.documentElement.style.setProperty('--sparkles', `url(${c.toDataURL()})`);
  })();

  /* ---------- Card data ---------- */
  const TYPES = {
    fire:  { f1: '#f3d6c2', f2: '#d98a5a', g1: '#ffae62', g2: '#c4461b', bg: ['#ffc58f', '#b8402b'], body: '#ff8a4c' },
    water: { f1: '#cfe4f5', f2: '#6a9fcc', g1: '#72c4ff', g2: '#1e5aa8', bg: ['#aee0ff', '#2a64a8'], body: '#5fb4f0' },
    grass: { f1: '#d9ecc8', f2: '#7fae62', g1: '#8fdc6a', g2: '#2f7a2c', bg: ['#d2f3ae', '#3c8237'], body: '#7cc46a' },
    volt:  { f1: '#d2efec', f2: '#58a8a0', g1: '#7ff0e2', g2: '#1d7f78', bg: ['#1f3b52', '#3c7e8c'], body: '#5fd9c8' },
    stone: { f1: '#e6ddd2', f2: '#a08c78', g1: '#d2bda4', g2: '#6d5946', bg: ['#e8dccd', '#76634f'], body: '#b59f86' },
  };
  const POOL = [
    { name: 'Emberkit', hp: 50, type: 'fire', strip: 'Cinder fox. Height 0.3 m.',
      moves: [{ cost: [1], name: 'Spark nip', dmg: 10 }, { cost: [1, 0], name: 'Kindle', dmg: 30, text: 'Discard an energy attached to this card.' }],
      flavor: 'Its tail flickers brighter when it is pleased.', num: '004/150' },
    { name: 'Tidepup', hp: 60, type: 'water', strip: 'Shoreline pup. Height 0.4 m.',
      moves: [{ cost: [1], name: 'Splash', dmg: 10 }, { cost: [1, 1], name: 'Undertow', dmg: 30, text: 'Your opponent switches their active card with a benched one.' }],
      flavor: 'Packs of them nap in warm tide pools at noon.', num: '021/150' },
    { name: 'Mossling', hp: 50, type: 'grass', strip: 'Sprout critter. Height 0.2 m.',
      moves: [{ cost: [1], name: 'Leaf flick', dmg: 10 }, { cost: [1, 0], name: 'Photosynth', dmg: 20, text: 'Heal 20 damage from this card.' }],
      flavor: 'The leaf on its head turns to follow the sun.', num: '033/150' },
    { name: 'Voltwick', hp: 40, type: 'volt', strip: 'Glow newt. Length 0.3 m.',
      moves: [{ cost: [1], name: 'Zap', dmg: 20 }, { cost: [1, 0, 0], name: 'Arc jump', dmg: 40, text: 'Flip a coin. If tails, this card does 10 damage to itself.' }],
      flavor: 'The bulb on its head hums softly during storms.', num: '048/150' },
    { name: 'Pebblit', hp: 70, type: 'stone', strip: 'Pebble beetle. Height 0.1 m.',
      moves: [{ cost: [1, 0], name: 'Roll out', dmg: 20 }, { cost: [1, 1, 0], name: 'Rockslide', dmg: 50 }],
      flavor: 'Often mistaken for an ordinary stone, to its delight.', num: '062/150' },
  ];
  const RARE = {
    name: 'Prismoth', hp: 70, rare: true, strip: 'Crystal-wing moth. Wingspan 40 cm.',
    f1: '#d9dfeb', f2: '#aab4c8', g1: '#b7a2ff', g2: '#5b3fc4',
    moves: [{ cost: [1], name: 'Refract', dmg: 30 }, { cost: [1, 0], name: 'Moonlit wingstorm', dmg: 60, text: "Flip a coin. If heads, the defending card can't attack during its next turn." }],
    flavor: 'It gathers moonlight in its wings and scatters it as rainbows before dawn.', num: '017/150',
  };

  const earsFor = (type, c) => ({
    fire:  `<polygon points="-24,-52 -14,-80 -4,-60" fill="${c}"/><polygon points="24,-52 14,-80 4,-60" fill="${c}"/><polygon points="-19,-58 -14,-72 -9,-61" fill="#fff5"/><polygon points="19,-58 14,-72 9,-61" fill="#fff5"/>`,
    water: `<path d="M-20,-52 Q-46,-70 -34,-38Z" fill="${c}"/><path d="M20,-52 Q46,-70 34,-38Z" fill="${c}"/>`,
    grass: `<path d="M0,-63 Q18,-92 34,-74 Q18,-62 0,-63Z" fill="#3f8f35"/><path d="M0,-63 Q18,-78 30,-73" stroke="#bff29a" fill="none"/>`,
    volt:  `<path d="M0,-62 Q-4,-78 0,-84" stroke="${c}" stroke-width="3" fill="none"/><circle cx="0" cy="-90" r="8" fill="#fffbd0"/><circle cx="0" cy="-90" r="14" fill="#fffbd044"/>`,
    stone: `<circle cx="-12" cy="-62" r="7" fill="#8d7a66"/><circle cx="8" cy="-64" r="5" fill="#8d7a66"/>`,
  })[type];
  const tailFor = (type, c) => type === 'fire'
    ? `<path d="M30,10 Q70,0 62,-34 Q56,-14 44,-18 Q52,-4 30,4Z" fill="#ffd36b"/><path d="M30,10 Q60,4 58,-22 Q50,-8 30,2Z" fill="${c}"/>`
    : type === 'water' ? `<path d="M32,8 Q66,20 70,-6 Q56,6 34,0Z" fill="${c}"/>`
    : type === 'volt' ? `<path d="M32,6 Q70,14 64,-12 Q60,-26 50,-16" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`
    : `<path d="M32,8 Q56,14 58,-4" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`;

  function critterArt(c, k) {
    const t = TYPES[c.type], id = 'g' + k;
    return `<svg viewBox="0 0 276 200" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.bg[0]}"/><stop offset="1" stop-color="${t.bg[1]}"/></linearGradient></defs>
      <rect width="276" height="200" fill="url(#${id})"/>
      <circle cx="${40 + k * 47 % 200}" cy="40" r="38" fill="#ffffff25"/>
      <ellipse cx="138" cy="168" rx="80" ry="12" fill="#0003"/>
      <g transform="translate(138 128)">
        ${tailFor(c.type, t.body)}
        <ellipse cx="0" cy="0" rx="38" ry="30" fill="${t.body}" stroke="#0004" stroke-width="1.5"/>
        <ellipse cx="0" cy="8" rx="22" ry="16" fill="#fff4"/>
        ${earsFor(c.type, t.body)}
        <circle cx="0" cy="-38" r="26" fill="${t.body}" stroke="#0004" stroke-width="1.5"/>
        <circle cx="-9" cy="-40" r="5.5" fill="#fff"/><circle cx="9" cy="-40" r="5.5" fill="#fff"/>
        <circle cx="-8" cy="-39" r="3" fill="#1d1a2e"/><circle cx="10" cy="-39" r="3" fill="#1d1a2e"/>
        <ellipse cx="-17" cy="-30" rx="5" ry="3" fill="#ff7b9c88"/><ellipse cx="17" cy="-30" rx="5" ry="3" fill="#ff7b9c88"/>
        <path d="M-4,-29 Q0,-25 4,-29" stroke="#1d1a2e" stroke-width="1.6" fill="none"/>
        <ellipse cx="-18" cy="28" rx="9" ry="5" fill="${t.body}" stroke="#0004"/><ellipse cx="18" cy="28" rx="9" ry="5" fill="${t.body}" stroke="#0004"/>
      </g></svg>`;
  }
  const PRISMOTH_ART = `<svg viewBox="0 0 276 200" aria-hidden="true"><defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1446"/><stop offset=".6" stop-color="#2d1d5c"/><stop offset="1" stop-color="#0f2a3f"/></linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#ffe9a8" stop-opacity=".6"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7f3ff" stop-opacity=".95"/><stop offset=".5" stop-color="#8e7dff" stop-opacity=".8"/><stop offset="1" stop-color="#ff9fd6" stop-opacity=".85"/></linearGradient>
    <linearGradient id="wingB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ffff0" stop-opacity=".9"/><stop offset="1" stop-color="#6a5cff" stop-opacity=".8"/></linearGradient></defs>
    <rect width="276" height="200" fill="url(#sky)"/><circle cx="210" cy="46" r="60" fill="url(#moon)"/><circle cx="210" cy="46" r="17" fill="#fff4cf"/>
    <g fill="#fff" opacity=".8"><circle cx="30" cy="22" r="1.2"/><circle cx="62" cy="48" r=".9"/><circle cx="110" cy="18" r="1.1"/><circle cx="150" cy="40" r=".8"/><circle cx="252" cy="110" r="1"/><circle cx="20" cy="92" r=".9"/></g>
    <path d="M0 168 Q50 140 100 160 T200 150 T276 158 V200 H0Z" fill="#0c1f30"/><path d="M0 182 Q70 160 140 178 T276 172 V200 H0Z" fill="#081521"/>
    <g transform="translate(138 108)">
      <polygon points="-4,-8 -92,-66 -106,-22 -58,6" fill="url(#wingA)" stroke="#e8fbff"/><polygon points="4,-8 92,-66 106,-22 58,6" fill="url(#wingA)" stroke="#e8fbff"/>
      <polygon points="-4,2 -64,12 -72,52 -22,40" fill="url(#wingB)" stroke="#e8fbff"/><polygon points="4,2 64,12 72,52 22,40" fill="url(#wingB)" stroke="#e8fbff"/>
      <g stroke="#fff" stroke-opacity=".55" stroke-width=".8" fill="none"><path d="M-4,-8 L-106,-22 M-4,-8 L-72,-38 M-58,6 L-92,-66 M4,-8 L106,-22 M4,-8 L72,-38 M58,6 L92,-66 M-4,2 L-72,52 M4,2 L72,52"/></g>
      <ellipse cx="0" cy="4" rx="7" ry="26" fill="#2b2250" stroke="#bfb2ff" stroke-width="1.2"/><ellipse cx="0" cy="-20" rx="8" ry="7" fill="#3a2e6c" stroke="#bfb2ff" stroke-width="1.2"/>
      <circle cx="-3.2" cy="-21" r="1.8" fill="#9ffff0"/><circle cx="3.2" cy="-21" r="1.8" fill="#9ffff0"/>
      <path d="M-3,-26 Q-14,-46 -26,-50 M3,-26 Q14,-46 26,-50" stroke="#d8cfff" stroke-width="1.4" fill="none"/>
      <circle cx="-26" cy="-50" r="2.2" fill="#fff4cf"/><circle cx="26" cy="-50" r="2.2" fill="#fff4cf"/></g></svg>`;

  function cardHTML(c, k) {
    const t = c.rare ? c : TYPES[c.type];
    const art = c.rare ? PRISMOTH_ART : critterArt(c, k);
    const foilBits = c.rare ? '<div class="foil"></div><div class="glitter"></div>' : '';
    return `<div class="card${c.rare ? ' rare' : ''}" ${c.rare ? `data-foil="${c.foil}"` : ''} tabindex="-1"
      style="--f1:${t.f1};--f2:${t.f2};--g1:${t.g1};--g2:${t.g2}"
      aria-label="${c.name}, ${c.rare ? 'rare holo' : 'common'} card. Press Enter for the next card; arrow keys tilt.">
      <div class="face"><div class="frame-bg"></div>
        ${c.rare ? '<div class="foil frame-foil"></div><div class="glitter frame-glitter"></div>' : ''}
        <div class="head"><span class="name">${c.name}</span><span class="hp"><small>Lumen</small>${c.hp} <span class="gem"></span></span></div>
        <div class="art">${art}${foilBits}</div>
        <div class="strip">${c.strip}</div>
        <div class="moves">${c.moves.map(m => `<div class="move">
          <span class="cost">${m.cost.map(g => `<span class="gem${g ? '' : ' plain'}"></span>`).join('')}</span>
          <h3>${m.name}</h3><span class="dmg">${m.dmg || ''}</span>${m.text ? `<p>${m.text}</p>` : ''}</div>`).join('')}</div>
        <div class="foot"><span class="flavor">${c.flavor}</span><span class="num">${c.num} ${c.rare ? '✦' : '●'}</span></div>
        <div class="glare"></div>
      </div></div>`;
  }

  /* ---------- Tilt engine (drives whichever element is active) ---------- */
  let active = pack, maxTilt = 8;
  const target = { ...REST }, cur = { ...REST };
  function aim(el, x, y) {
    const r = el.getBoundingClientRect();
    const nx = Math.min(Math.max((x - r.left) / r.width, 0), 1);
    const ny = Math.min(Math.max((y - r.top) / r.height, 0), 1);
    const m = reduced ? maxTilt * .4 : maxTilt;
    Object.assign(target, { px: nx * 100, py: ny * 100, ry: (nx - .5) * 2 * m, rx: (.5 - ny) * 2 * m, o: 1 });
  }
  const rest = () => Object.assign(target, REST);
  function setActive(el, tilt) {
    Object.assign(cur, REST); rest();
    active = el; maxTilt = tilt;
  }
  (function loop() {
    for (const k in cur) cur[k] += (target[k] - cur[k]) * .12;
    const s = active.style;
    s.setProperty('--rx', cur.rx.toFixed(2) + 'deg'); s.setProperty('--ry', cur.ry.toFixed(2) + 'deg');
    s.setProperty('--px', cur.px.toFixed(2)); s.setProperty('--py', cur.py.toFixed(2));
    s.setProperty('--o', cur.o.toFixed(3));
    requestAnimationFrame(loop);
  })();

  /* ---------- Jagged tear geometry ---------- */
  let tearPts = [], progress = 0, dir = 1, state = 'sealed';
  function buildGeometry() {
    const T = 28, N = 22, top = [], bottom = [];
    for (let i = 0; i <= T; i++) { top.push([i / T * 100, i % 2 ? 1.4 : 0]); bottom.push([i / T * 100, 100 - (i % 2 ? 1.4 : 0)]); }
    tearPts = [];
    for (let i = 0; i <= N; i++) tearPts.push([i / N * 100, TEAR_Y + (i % 2 ? .9 : -.9) + (Math.random() - .5) * .9]);
    const poly = pts => `polygon(${pts.map(([x, y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`).join(',')})`;
    packTop.style.clipPath = poly([...top, ...[...tearPts].reverse()]);
    packBody.style.clipPath = poly([...tearPts, ...[...bottom].reverse()]);
    const str = tearPts.map(p => p.join(',')).join(' ');
    guide.setAttribute('points', str); rip.setAttribute('points', str);
  }
  function setTear(p) {
    progress = Math.min(Math.max(p, 0), 1);
    packTop.style.transformOrigin = `${dir > 0 ? 100 : 0}% ${TEAR_Y}%`;
    packTop.style.transform = `translateY(${-progress * 5}px) rotate(${dir * -progress * 6}deg)`;
    rip.setAttribute('stroke-dashoffset', 1 - progress);
    guide.style.opacity = 1 - progress;
  }

  /* ---------- Pack interaction: drag across the top to tear ---------- */
  let tearing = false, startX = 0, base = 0, dirLocked = false;
  pack.addEventListener('pointerdown', e => {
    if (state !== 'sealed') return;
    const r = pack.getBoundingClientRect();
    if ((e.clientY - r.top) / r.height > .32) return;       // only the top strip tears
    tearing = true; startX = e.clientX; base = progress;
    pack.setPointerCapture(e.pointerId);
  });
  pack.addEventListener('pointermove', e => {
    if (state !== 'sealed') return;
    aim(pack, e.clientX, e.clientY);
    if (!tearing) return;
    const dx = e.clientX - startX;
    if (!dirLocked && Math.abs(dx) > 6) {                     // first drag decides direction
      dir = Math.sign(dx); dirLocked = true;
      const pts = dir > 0 ? tearPts : [...tearPts].reverse();
      rip.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    }
    if (dirLocked) setTear(base + Math.max(0, dx * dir) / pack.getBoundingClientRect().width * 1.15);
    if (progress >= 1) { tearing = false; openPack(); }
  });
  const endTear = () => { tearing = false; if (state === 'sealed' && progress >= .8) openPack(); };
  pack.addEventListener('pointerup', endTear);
  pack.addEventListener('pointercancel', endTear);
  pack.addEventListener('pointerleave', () => { if (!tearing && state === 'sealed') rest(); });

  tearBtn.addEventListener('click', () => {
    if (state !== 'sealed') return;
    dirLocked = true; const from = progress, t0 = performance.now();
    (function step(now) {
      const t = Math.min((now - t0) / 650, 1);
      setTear(from + (1 - from) * (1 - Math.pow(1 - t, 2)));
      t < 1 ? requestAnimationFrame(step) : openPack(true);
    })(t0);
  });

  /* ---------- Opening sequence ---------- */
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function openPack(viaKeyboard) {
    if (state !== 'sealed') return;
    state = 'opening'; rest();
    pack.classList.remove('sealed');
    tearBtn.hidden = true; hint.textContent = '';
    tearLine.style.opacity = 0;
    packTop.classList.add('flying');
    packTop.style.transform = `translate(${dir * 45}%, -120%) rotate(${dir * 24}deg)`;
    await wait(250);
    stack.style.transform = 'translateY(-58%)';               // cards slide up out of the mouth
    await wait(750);
    packBody.classList.add('leave');                          // wrapper drops away
    pack.classList.add('out');                                // cards move in front
    await wait(250);
    stack.style.transform = 'translateY(-7.3%)';              // settle centered
    await wait(550);
    state = 'reveal';
    focusTop(viaKeyboard);
    updateHint();
  }

  /* ---------- Revealing cards one by one ---------- */
  let cards = [];
  const slots = () => [...stack.querySelectorAll('.slot:not(.gone)')];
  function focusTop(move) {
    const top = slots()[0]; if (!top) return;
    const card = top.querySelector('.card');
    stack.querySelectorAll('.card').forEach(c => c.tabIndex = -1);
    card.tabIndex = 0;
    setActive(card, 16);
    if (move) card.focus({ preventScroll: true });
    if (card.classList.contains('rare')) {
      burst.classList.remove('go'); void burst.offsetWidth;
      if (!reduced) burst.classList.add('go');
    }
  }
  function updateHint() {
    const s = slots(), idx = cards.length - s.length + 1;
    const isRare = s[0]?.querySelector('.card.rare');
    if (isRare) {
      hint.textContent = `Card ${idx} of ${cards.length}. Rare holo! Tilt it to see the foil.`;
      againBtn.hidden = false;
    } else {
      hint.textContent = `Card ${idx} of ${cards.length}. Tap the card to see the next one.`;
    }
  }
  function next() {
    const s = slots();
    if (state !== 'reveal' || s.length <= 1) return;
    const hadFocus = s[0].contains(document.activeElement);
    s[0].classList.add('gone');
    setTimeout(() => s[0].remove(), 500);
    s.slice(1).forEach((el, i) => el.style.setProperty('--i', i));
    focusTop(hadFocus);
    updateHint();
  }

  let downAt = null;
  stack.addEventListener('pointermove', e => {
    if (state === 'reveal' && active.classList.contains('card')) aim(active, e.clientX, e.clientY);
  });
  stack.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; if (e.pointerType !== 'mouse' && state === 'reveal') aim(active, e.clientX, e.clientY); });
  stack.addEventListener('pointerup', e => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
    downAt = null;
    if (e.pointerType !== 'mouse') rest();
    if (moved < 8) next();                                    // a tap, not a tilt-drag
  });
  stack.addEventListener('pointerleave', () => { if (state === 'reveal') rest(); });
  stack.addEventListener('keydown', e => {
    if (state !== 'reveal') return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); return; }
    const k = { ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, -12], ArrowDown: [0, 12] }[e.key];
    if (k) {
      e.preventDefault();
      const r = active.getBoundingClientRect();
      const px = Math.min(Math.max(target.px + k[0], 0), 100), py = Math.min(Math.max(target.py + k[1], 0), 100);
      aim(active, r.left + r.width * px / 100, r.top + r.height * py / 100);
    } else if (e.key === 'Escape') rest();
  });

  /* ---------- New pack ---------- */
  function newPack() {
    wrap.classList.add('no-anim');
    state = 'sealed'; progress = 0; dir = 1; dirLocked = false;
    pack.classList.remove('out'); pack.classList.add('sealed');
    packTop.classList.remove('flying'); packTop.style.transform = '';
    packBody.classList.remove('leave');
    stack.style.transform = '';
    tearLine.style.opacity = 1;
    stack.querySelectorAll('.slot').forEach(s => s.remove());

    const commons = [...POOL].sort(() => Math.random() - .5).slice(0, 4);
    const rare = { ...RARE, foil: ['rainbow', 'reverse', 'cosmos'][Math.floor(Math.random() * 3)] };
    cards = [...commons, rare];
    cards.forEach((c, k) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--i', k);
      slot.style.zIndex = cards.length - k;
      slot.innerHTML = cardHTML(c, k);
      stack.appendChild(slot);
    });

    buildGeometry(); setTear(0);
    setActive(pack, 8);
    tearBtn.hidden = false; againBtn.hidden = true;
    hint.textContent = 'Drag across the top of the pack to tear it open.';
    void wrap.offsetWidth;
    wrap.classList.remove('no-anim', 'enter'); void wrap.offsetWidth; wrap.classList.add('enter');
  }
  againBtn.addEventListener('click', () => { newPack(); tearBtn.focus(); });
  newPack();
})();
</script>
</body>
</html>
